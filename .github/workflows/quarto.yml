name: mup1 #jakakolwiek nazwa
on: push
jobs:
      hej: #jakakolwiek nazwa
          runs-on: ubuntu-latest
          steps:
              - uses: actions/checkout@v7
              - uses: quarto-dev/quarto-actions/setup@v2
                with:
                    tinytex: true
              - run: pin install ipykernel nbclient matplotlib PyMPDATA
              - run: quarto render mup_lab1.ipynb --to pdf --execute
              - uses: actions/upload-artifact@v7
                with:
                    path: mup_lab1.ipynb
        
